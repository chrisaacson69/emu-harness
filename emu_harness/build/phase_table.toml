# The build tool's phase table: the one list of phases, in order. PHASES.md is the manual over it
# (tests/test_build.py holds its headings to these keys), and a project's re-roadmap.toml names
# its phases by these keys.
#
# Per phase:
#   key, name   the id a roadmap uses, and the heading in PHASES.md
#   gate        what proves the phase done (the exit check)
#   paths       library paths (repo-relative) the gate depends on, per track. A gate recorded at
#               emu-harness commit C is stale when a commit after C touched one of these paths.
#               "common" applies to both tracks; "vm" (KOEI bytecode titles) and "native" add to it.

[[phase]]
key  = "classify"
name = "Classify"
gate = "The one fact that dictates the method (VM or native; turn-based or real-time; is the static-runtime join cheap) is written down with its evidence."
paths.common = ["emu_harness/machines/nes/memory.py", "emu_harness/machines/snes/header.py", "emu_harness/machines/snes/mapper.py"]
paths.vm     = ["emu_harness/vm/koei/nes/native_floor.py", "emu_harness/vm/koei/snes/native_floor.py"]
paths.native = []

[[phase]]
key  = "recon"
name = "Recon"
gate = "Bank windows come from evidence; VM: every bytecode bank tiles with 0 errors from a walker that can fail, and the shared toolchain's load-bearing assumptions were re-derived on this title."
paths.common = ["emu_harness/machines/nes/memory.py", "emu_harness/machines/snes/mapper.py", "emu_harness/passes/strings.py"]
paths.vm     = ["emu_harness/vm/koei/isa.py", "emu_harness/vm/koei/nes/games.toml", "emu_harness/vm/koei/nes/vm-opcodes-v2.toml", "emu_harness/vm/koei/nes/vm_disasm.py", "emu_harness/vm/koei/nes/titles.py", "emu_harness/vm/koei/nes/gates/roundtrip.py", "emu_harness/vm/koei/nes/gates/compare_probe.py", "emu_harness/vm/koei/snes/games.toml", "emu_harness/vm/koei/snes/vm_walk.py"]
paths.native = []

[[phase]]
key  = "discover"
name = "Code discovery"
gate = "0 walker conflicts; every jump table read in full; phantoms dropped or marked DATA."
paths.common = ["emu_harness/cpu/m6502/descent.py", "emu_harness/cpu/m6502/disasm.py", "emu_harness/cpu/m6502/signature.py"]
paths.vm     = ["emu_harness/vm/koei/match.py", "emu_harness/vm/koei/nes/native_floor.py", "emu_harness/vm/koei/nes/match.py", "emu_harness/vm/koei/snes/native_floor.py"]
paths.native = ["emu_harness/cpu/m6502/coverage.py", "emu_harness/cpu/m6502/cpu.py", "emu_harness/passes/native.py", "emu_harness/machines/nes/bus.py"]

[[phase]]
key  = "data"
name = "Data, pure lane"
gate = "Oracle lanes ran deterministically (strings, manual schema, ~20 hot globals); schema is per title, offsets stay field+N until code proves them."
paths.common = ["emu_harness/passes/strings.py", "emu_harness/core/symbols.py"]
paths.vm     = ["emu_harness/vm/koei/nes/dataxref.py", "emu_harness/vm/koei/nes/strings.py", "emu_harness/vm/koei/nes/romdata.py", "emu_harness/vm/koei/snes/data_walk.py", "emu_harness/vm/koei/snes/strings_snes.py"]
paths.native = ["emu_harness/passes/native.py"]

[[phase]]
key  = "structure"
name = "Structure"
gate = "Primitives probed against the live handler; VM round-trip byte-identical; the rendered C equals the ROM by value on the title's fixtures; one call graph with a leaves-first order."
paths.common = ["emu_harness/passes/callgraph.py", "emu_harness/walk/prep.py"]
paths.vm     = ["emu_harness/vm/koei/nes/callgraph.py", "emu_harness/vm/koei/nes/gates", "emu_harness/vm/koei/nes/vm_stack_effect.py", "emu_harness/vm/koei/nes/vm_assemble.py", "emu_harness/vm/koei/snes/vm_callgraph.py", "emu_harness/vm/koei/snes/vm_semantics.py"]
paths.native = ["emu_harness/passes/native.py"]

[[phase]]
key  = "naming"
name = "Naming"
gate = "Bottom-up then top-down passes done; proposals verified at a lower artifact; the guard holds; no placeholder names."
paths.common = ["emu_harness/walk", "emu_harness/core/symbols.py", "emu_harness/passes/callgraph.py"]
paths.vm     = ["emu_harness/vm/koei/nes/vocabulary.toml", "emu_harness/vm/koei/nes/match.py", "emu_harness/vm/koei/nes/vm_decompile.py"]
paths.native = ["emu_harness/passes/native.py"]

[[phase]]
key  = "presentation"
name = "Presentation"
gate = "Every rung of the source ladder this track has is regenerated by the shared tools and matches what is committed."
paths.common = ["emu_harness/passes/listing.py", "emu_harness/backends/mesen/labels.py", "emu_harness/core/symbols.py", "emu_harness/cpu/m6502/disasm.py"]
paths.vm     = ["emu_harness/vm/koei/nes/vm_disasm.py", "emu_harness/vm/koei/nes/vm_decompile.py", "emu_harness/vm/koei/nes/dream.py", "emu_harness/vm/koei/nes/cli", "emu_harness/vm/koei/snes/gen_layers.py", "emu_harness/vm/koei/snes/gen_source.py", "emu_harness/vm/koei/snes/vm_dream.py"]
paths.native = []

[[phase]]
key  = "assets"
name = "Assets"
gate = "Renders come from ROM bytes through the library and match the live PPU."
paths.common = ["emu_harness/machines/nes/ppu.py", "emu_harness/machines/nes/canvas.py", "emu_harness/machines/nes/ppuport.py", "emu_harness/machines/nes/bus.py"]
paths.vm     = ["emu_harness/vm/koei/nes/assets"]
paths.native = []

[[phase]]
key  = "live"
name = "Live verification"
gate = "The game's own routine runs over live RAM for every input, and a planted fault fails the check."
paths.common = ["emu_harness/backends/mesen", "emu_harness/machines/nes/live.py", "emu_harness/machines/nes/trace.py", "emu_harness/machines/nes/ppuport.py", "emu_harness/machines/nes/bus.py", "emu_harness/cpu/m6502/cpu.py"]
paths.vm     = ["emu_harness/vm/koei/nes/nobunaga_vm.py"]
paths.native = []
