coresident_12 = [10]
coresident_13 = [10]
coresident_14 = [10]
banks_at_c000  = [30]            # bank 30 @ $C000-$DFFF (semi-fixed lower bank: bytecode OS/UI lib interleaved w/ native)
banks_at_e000  = [31]            # bank 31 @ $E000-$FFFF (true fixed bank: native VM engine + OS-main bytecode $E17D)
fixed_region   = [0xE000, 0xFFFF]   # MMC5 pins last 8K (bank 31); bank 30 @ $C000 effectively fixed
fixed_section  = "prg.bank31"    # fixed-region label scope = bank 31 ($E000-$FFFF), like NA2; frees [prg.bank15] for the actual bank 15 bytecode
