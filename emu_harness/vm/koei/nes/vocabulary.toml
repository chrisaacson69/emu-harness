# Canonical names for KOEI NES routines shared across titles (emu-harness MIGRATION.md row E).
#
# `match family` finds twins mechanically; this file is the inference that names them. Each
# [[routine]] names an ANCHOR ("<title> b<bank> $ADDR" for bytecode, "<title> $ADDR" for the fixed
# bank's native code); every routine in any title whose signature is IDENTICAL to the anchor's takes
# `name`. Near twins (a changed constant, an extra argument) are different functions: they keep their
# own names unless they have an entry of their own.
#
# Rules used (Chris, 2026-10-23):
#   - Name what the code does, at its own level: `ratio_percent`, not a caller's `calc_loyalty_gain`.
#   - Pairs and families read alike (`char_to_upper` / `char_to_lower`, `*_saturating`, `blend_*`).
#   - Settled by a lower artifact where one exists (the ext-op dispatch table, the handler's code),
#     never by a vote of the titles' names.
#   - Without a rule or an artifact, the earliest title's name (games.toml order = release order;
#     koei-nes docs/shared-library.md: NA1 is the established vocabulary) stays the default.
# [[conflict]] marks identical code under contradictory names that needs a read before anyone renames.

# ---- bytecode: the shared core library ------------------------------------------------------
