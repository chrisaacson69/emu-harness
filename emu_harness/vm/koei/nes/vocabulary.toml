# ---- native: the 32-bit ALU, settled by each title's ext-op dispatch table -------------------
# GemFire's `ext_*` names sit one handler off: its table puts $ED4E at ext op $14 (push32) and $EB16 at
# $1E (smod32), the handlers na2/bk name push_a32_to_vm_stack / smod32. bk's and GemFire's
# `halve_a32` / `halve_a32_rounded` are ext ops $1B / $1C: the code adds 1 / $FFFFFFFF across $08-$0B,
# so inc32 / dec32 (the shared table's names).
[[routine]]
anchor = "bk $F145"
name = "inc32"
why = "Ext op $1B: adds 1 to the 32-bit value at $08 with carry (read). Was halve_a32."

[[routine]]
anchor = "bk $F140"
name = "dec32"
why = "Ext op $1C: adds $FFFFFFFF (Y=$FF) to $08 (read). Was halve_a32_rounded."

[[routine]]
anchor = "bk $EEEC"
name = "umul32"
why = "Ext op $01 (bk's table). GemFire `ext_mul32`."

[[routine]]
anchor = "bk $EF96"
name = "smod32"
why = "Ext op $1E (bk's table). GemFire `ext_abs_b_to_a` is off by one handler."

[[routine]]
anchor = "bk $F1CE"
name = "push_a32_to_vm_stack"
why = "Ext op $14 (push32). GemFire `ext_store_a_frame` is off by one handler."

[[routine]]
anchor = "bk $F1D7"
name = "pop_b32_from_vm_stack"
why = "Ext op $15 (pop32). GemFire `ext_load_b_frame` is off by one handler."

[[routine]]
anchor = "bk $F1ED"
name = "load_a32_via_a_ptr"
why = "Ext op $16 (ldL.mem). GemFire `ext_store_a_indirect` is off by one handler."

[[routine]]
anchor = "bk $F16A"
name = "swap_a_b32"
why = "Ext op $1A (swap32)."

[[routine]]
anchor = "bk $EFAA"
name = "add32"

[[routine]]
anchor = "bk $EFB7"
name = "sub32"

